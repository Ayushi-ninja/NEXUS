services:
  - type: web
    name: junction-ai-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: WEATHER_CITY
        value: Mumbai
      - key: ALLOWED_ORIGINS
        value: '["https://your-frontend.vercel.app","http://localhost:5173"]'
